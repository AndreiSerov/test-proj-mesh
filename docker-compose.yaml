# Local development database. The app itself runs from the IDE or `./mvnw spring-boot:run`
# with the `local` profile, see application-local.yml.
services:
  postgres:
    image: postgres:18-alpine
    container_name: bank-db
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5432:5432"
    volumes:
      - bank-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bank-db-data:
